# SmartBI es una SPA estática. Nginx sirve los archivos compilados directamente;
# no existe un backend ni un puerto interno de aplicación.
server {
    listen 80;
    listen [::]:80;
    server_name smartbi.innovalogic.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/smartbi.innovalogic.tech/acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartbi.innovalogic.tech;

    root /var/www/smartbi.innovalogic.tech/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/smartbi.innovalogic.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartbi.innovalogic.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # El Excel nunca se envía al servidor: se procesa dentro del navegador.
    # Estos encabezados reducen la superficie de ataque de la aplicación pública.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Los nombres de assets de Vite incluyen un hash. Se pueden guardar un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html debe consultarse de nuevo para descubrir cada versión publicada.
    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    # `_headers` es útil en otros proveedores, pero no debe verse como documento.
    location = /_headers {
        return 404;
    }

    # Fallback necesario para enlaces como /#/docs/arquitectura y futuras rutas SPA.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    access_log /var/log/nginx/smartbi-access.log;
    error_log /var/log/nginx/smartbi-error.log;
}
