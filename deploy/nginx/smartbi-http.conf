# Configuración temporal para obtener el primer certificado TLS.
# El script bootstrap-production.ps1 la reemplaza por smartbi.conf.
server {
    listen 80;
    listen [::]:80;
    server_name smartbi.innovalogic.tech;

    root /var/www/smartbi.innovalogic.tech/current;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/smartbi.innovalogic.tech/acme;
    }

    location / {
        # No publicar la aplicación hasta que HTTPS esté listo.
        return 503;
    }

    access_log /var/log/nginx/smartbi-access.log;
    error_log /var/log/nginx/smartbi-error.log;
}
